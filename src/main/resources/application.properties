# Application Name
spring.application.name=Women-Safety-Device

# Server Port
server.port=8082
server.address=0.0.0.0
# Supabase PostgreSQL connection. Use the pooler URL from Supabase for deployments.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.admin.email=${ADMIN_EMAIL:}
app.admin.registration-key=${ADMIN_REGISTRATION_KEY:}
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:panic-evidence}
# Multipart file handling configuration (For Audio/Image Evidence Uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


